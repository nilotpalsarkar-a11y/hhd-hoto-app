<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>HHD HOTO</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f0f0; }
        h1 { color: #2874F0; }
        #preview { max-width: 90%; max-height: 50vh; margin-top: 20px; border-radius: 10px; display: none; }
        .btn { background: #2874F0; color: white; padding: 15px 30px; border-radius: 25px; text-decoration: none; font-size: 18px; margin-top: 20px; display: inline-block; cursor: pointer; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <h1>HHD HOTO</h1>
    <label class="btn">
        Capture HOTO Photo
        <input type="file" accept="image/*" capture="environment" id="cameraInput">
    </label>
    <img id="preview" />
    <script>
        document.getElementById('cameraInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = document.getElementById('preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });
    </script>
</body>
</html>
